(function(){

    document.querySelectorAll('#view .card[data-id]').forEach(card=>{
      const id=card.dataset.id;
      const project=projects.find(item=>item.id===id);
      if(!project)return;
      card.removeAttribute('data-id');
      card.dataset.projectCard=id;
      card.setAttribute('role','button');
      card.onclick=event=>{if(!event.target.closest('.card-delete'))window.detail(project)};
      card.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('.card-delete')){event.preventDefault();window.detail(project)}};
      if(!card.querySelector('.card-delete')){

        button.type='button';button.className='card-delete';button.title='Excluir projeto';button.setAttribute('aria-label','Excluir '+project.title);button.innerHTML='×';
        button.onclick=async event=>{
          event.stopPropagation();

          const keys=[project.iconAssetId,project.coverAssetId,project.companyLogoAssetId,...(project.projectMetadata||[]).map(item=>item.assetId),...(project.galleryAssetIds||[])].filter(Boolean);
          projects=projects.filter(item=>item.id!==id);

        };
        card.appendChild(button);
